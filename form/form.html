<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja parceiro - PetroSenai</title>
    <link rel="stylesheet" href="formstyles.css">
    <link rel="icon" href="../images/logo.png">
</head>
<body>
    <div class="welcome">
        <!--texto de apresentação-->
        <h1> SEJA PARCEIRO</h1>
        <p>Insira as informações de sua empresa e venha trabalhar conosco</p>
    </div>
    
    <!--formulário-->
    <form>
        <div class="formulario">
        <label for="razaosocial">
            Razão Social
        </label>
        <input type="text" id="razaosocial" required>

        <label for="cnpj">
            CNPJ
        </label>
        <input type="text" id="cnpj" placeholder="00.000.000/0001-00" required >

        <label for="email">
            E-mail de contato
        </label>
        <input type="email" id="email" placeholder="example@email.com" required>

        <!--fieldset radio-->
        <fieldset>
            <legend>Porte da empresa:</legend>
            <!--radio 4 opções-->
            <label for="micro">
                <input type="radio" id="micro" value="micro" name="porte da empresa">
                Micro
            </label>
            <br>
            <label for="pequena">
                <input type="radio" id="pequena" value="pequena" name="porte da empresa">
                Pequena
            </label>
            <br>
            <label for="media">
                <input type="radio" id="media" value="media" name="porte da empresa">
                Média
            </label>
            <br>
            <label for="grande">
                <input type="radio" id="grande" value="grande" name="porte da empresa">
                Grande
            </label>
        </fieldset>

        <!--fieldset checkbox-->

        <fieldset>
            <legend>Área de trabalho:</legend>
            <!--checkbox 4 opções-->
            <label for="equipamentos">
                <input type="checkbox" id="equipamentos" value="equipamentos" name="áreatrabalho">
                Equipamentos
            </label>
            <br>
            <label for="logística">
                <input type="checkbox" id="logística" value="logística" name="áreatrabalho">
                Logística
            </label>
            <br>
            <label for="alimentação">
                <input type="checkbox" id="alimentação" value="alimentação" name="áreatrabalho">
                Alimentação
            </label>
            <br>
            <label for="limpeza">
                <input type="checkbox" id="limpeza" value="limpeza" name="áreatrabalho">
                Limpeza
            </label>
            <br>
            <label for="educação">
                <input type="checkbox" id="educação" value="educação" name="áreatrabalho">
                Educação
            </label>
        </fieldset>
        <!--textarea-->
        Faça uma breve apresentação do seu negócio e o motivo de contato:
        <textarea name="apresentação" id="apresentação"></textarea>
        </div>
        
        <div class="botoes">
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </div>
    </form>
    <div class="voltar">
        <button onclick="window.location.href='../index.html'">Voltar</button>
    </div>
</body>
</html>
